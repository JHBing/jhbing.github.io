      --panel: #ffffff;

      --cereals-icon: #a67c00;
      --fruits-bg: #ffe0e6;
      --fruits-bd: #e85d75;
      --fruits-icon: #c2304a;
      --vegetables-bg: #d8f5d3;
      --vegetables-bd: #3d9a4a;
      --vegetables-icon: #1f6b2c;
      --other-bg: #dde9ff;
      --other-bd: #3b6fd8;
      --other-icon: #1f4fb0;
      --icon-upper: #d64545;
      --icon-child: #e67e22;
      --icon-deep: #3b6fd8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #eef2f7 0%, var(--bg) 40%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    #search {
      flex: 1 1 260px;
      min-width: 200px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--panel);
    }
    .btn {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { background: #f0f4f8; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1.5px solid;
    }
    .swatch.cereals { background: var(--cereals-bg); border-color: var(--cereals-bd); }
    .swatch.fruits { background: var(--fruits-bg); border-color: var(--fruits-bd); }
    .swatch.vegetables { background: var(--vegetables-bg); border-color: var(--vegetables-bd); }
    .swatch.other { background: var(--other-bg); border-color: var(--other-bd); }
    .legend-icon {
      width: 16px;
      height: 16px;
      display: inline-block;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      vertical-align: middle;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px 20px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }
    #tree {
      font-size: 14px;
      min-height: 480px;
    }
    /* Species boxed leaves */
    .jstree-default a.species-box {
      display: inline-flex !important;
      align-items: center;
      padding: 2px 10px 2px 4px !important;
      border-radius: 8px;
      border: 1.5px solid;
      margin: 2px 0;
      height: auto !important;
      line-height: 1.45 !important;
      white-space: normal !important;
    }
    .jstree-default a.species-box.cat-cereals {
      background: var(--cereals-bg);
      border-color: var(--cereals-bd);
    }
    .jstree-default a.species-box.cat-fruits {
      background: var(--fruits-bg);
      border-color: var(--fruits-bd);
    }
    .jstree-default a.species-box.cat-vegetables {
      background: var(--vegetables-bg);
      border-color: var(--vegetables-bd);
    }
    .jstree-default a.species-box.cat-other {
      background: var(--other-bg);
      border-color: var(--other-bd);
    }
    /* Custom taxonomy / species icons (before node text) */

    .jstree-default .jstree-themeicon.icon-child,

      background-image: none !important;
      background-size: 16px 16px !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      width: 18px !important;
      height: 18px !important;
      line-height: 18px !important;
      margin-right: 4px !important;
      opacity: 1 !important;

      search: {
        case_insensitive: true,
        show_only_matches: true,
        show_only_matches_children: true
      }
    });

    let searchTimer = null;
    $("#search").on("keyup", function () {
      const q = $(this).val();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        $("#tree").jstree(true).search(q);
      }, 250);
    });

    $("#btn-expand").on("click", function () {
      $("#tree").jstree("open_all");
    });
    $("#btn-collapse").on("click", function () {
      $("#tree").jstree("close_all");
    });
